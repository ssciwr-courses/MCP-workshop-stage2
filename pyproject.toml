[project]
name = "mcp-climate-example"
version = "0.1.0"
description = "MCP server wrapping the mock climate processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "matplotlib",
    "pandas",
    "pyyaml",
    "mcp[cli]>=2.1.1,<3",
]

[project.scripts]
climate-mcp-server = "mcp_server.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]

[tool.setuptools.package-data]
mcp_server = ["data/*.csv", "config/*.json"]
